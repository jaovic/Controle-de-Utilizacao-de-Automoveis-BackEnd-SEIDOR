services:
  db:
    image: postgres:16-alpine
    container_name: ttp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ttp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ttp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: ttp-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ttp?schema=public
      SEED: "true"
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100
    ports:
      - "3333:3333"

volumes:
  pgdata:
